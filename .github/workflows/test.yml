# 测试流程：验证会话头修复等核心逻辑
# 本地 Windows 缺少 protoc，原生 cargo test 跑不起来，统一放到 Action 里跑
name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    # 单测里写死了 /tmp 等路径，Windows 下必然失败；构建才用 Windows，测试固定跑 Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-ubuntu
      # 只跑本次修复相关的回归测试：16 个 model_switch 用例，几分钟内完成
      # 全量 6600+ 用例在 Debug 下跑一小时以上，且存在与本次改动无关的栈溢出旧问题，不在此流程里跑
      - name: 运行会话头回归测试
        run: cargo test -p xai-grok-shell --lib model_switch -- --nocapture
