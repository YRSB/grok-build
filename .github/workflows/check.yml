name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: choco install protoc -y
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check shell crate
        run: cargo check -p xai-grok-shell

  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc and MinGW
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-windows-gnu
      - name: Check shell crate for Windows
        run: cargo check -p xai-grok-shell --target x86_64-pc-windows-gnu
      - name: Build Windows binary
        run: cargo build -p xai-grok-pager-bin --target x86_64-pc-windows-gnu
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-windows-gnu
          path: target/x86_64-pc-windows-gnu/debug/xai-grok-pager.exe
